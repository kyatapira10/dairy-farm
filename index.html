const STORAGE_KEY  = 'dairy_repro_v2';

/* ── ユーティリティ ── */
const qs = sel => document.querySelector(sel);
function diffDays(ds){
  if(!ds) return null;
  const d=new Date(ds); d.setHours(0,0,0,0);
  return Math.round((d-TODAY)/86400000);
}
function addDays(ds,n){
  const d=new Date(ds); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10);
}
function age(bd){
  const m=Math.floor((Date.now()-new Date(bd))/(1000*60*60*24*30.44));
  return m>=12?`${Math.floor(m/12)}歳${m%12}ヶ月`:`${m}ヶ月`;
}
function monthAge(bd){
  return Math.floor((Date.now()-new Date(bd))/(1000*60*60*24*30.44));
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2800);
}
function customConfirm(msg,onOk,label='削除する',color='#C62828'){
  const d=document.createElement('div'); d.className='confirm-overlay';
  d.innerHTML=`<div class="confirm-box"><div class="confirm-msg">${msg}</div><div class="confirm-btns"><button id="cf-cancel" style="background:#EEF2F7;color:#555">キャンセル</button><button id="cf-ok" style="background:${color};color:#fff">${label}</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#cf-ok').onclick=()=>{d.remove();onOk();};
  d.querySelector('#cf-cancel').onclick=()=>d.remove();
  d.onclick=e=>{if(e.target===d)d.remove();};
}

/* ── ストレージ ── */
const Store = {
  load(){
    try{
      const s=localStorage.getItem(STORAGE_KEY);
      if(s){
        const st=JSON.parse(s);
        return {cattle:st.cattle||[],events:st.events||[]};
      }
      // 旧バージョン移行（cattleのみ引き継ぎ、eventsはデフォルト使用）
      for(const k of ['dairy_repro_v1','dairy_repro_v8','dairy_repro_v7','dairy_repro_v6','dairy_repro_v5','dairy_repro_v4','dairy_repro_v3']){
        const old=localStorage.getItem(k);
        if(old){
          const o=JSON.parse(old);
          // 旧eventsに分娩イベントがなければデフォルトを使う
          const oldEvs=o.events||[];
          const hasBirth=oldEvs.some(e=>e.type==='分娩');
          const eventsToUse=hasBirth?oldEvs:EVENTS_DATA;
          // 旧cattle + 新events でマージ。新キーで保存
          const migrated={cattle:o.cattle||[],events:eventsToUse};
          localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated));
          return migrated;
        }
      }
      return null;
    }catch{return null;}
  },
  save(st){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify({cattle:st.cattle,events:st.events}));}catch{} },
  getDefault(){
    const cattle=CATTLE_DATA;
    const events=EVENTS_DATA;
    return {cattle,events};
  }
};

  // 1) PAG検査・分娩イベントの補完
  const existingIds = new Set(STATE.events.map(e=>e.id));
  const missing = EVENTS_DATA.filter(e=>e.type==='PAG検査' && !existingIds.has(e.id));
  const cattleWithBirth = new Set(STATE.events.filter(e=>e.type==='分娩').map(e=>Number(e.cattleId)));
  const missingBirth = EVENTS_DATA.filter(e=>e.type==='分娩' && !cattleWithBirth.has(Number(e.cattleId)));
  if(missing.length > 0 || missingBirth.length > 0){
    STATE.events = [...STATE.events, ...missing, ...missingBirth];
    dirty = true;
  }
  // 分娩イベントの日付をEVENTS_DATAで正しい値に上書き（古いデータの修正）
  // ※EVENTS_DATAに存在するidのみ対象（手動追加した分娩は上書きしない）
  const birthDateMapById = {};
  EVENTS_DATA.filter(e=>e.type==='分娩').forEach(e=>{ birthDateMapById[e.id]=e.date; });
  STATE.events = STATE.events.map(e=>{
    if(e.type==='分娩' && birthDateMapById[e.id] && e.date!==birthDateMapById[e.id]){
      dirty=true;
      return {...e, date:birthDateMapById[e.id]};
    }
    return e;
  });

  // 2) 分娩予定日なしの牛の妊娠鑑定イベントを削除（誤った妊鑑+を修正）
  // EVENTS_DATAに存在するidのみ対象（手動追加した妊娠鑑定は削除しない）
  const invalidPregIds = new Set(
    EVENTS_DATA.filter(e=>e.type==='妊娠鑑定').map(e=>e.id)
  );
  const validPregCids = new Set(
    EVENTS_DATA.filter(e=>e.type==='妊娠鑑定').map(e=>Number(e.cattleId))
  );
  const beforeLen = STATE.events.length;
  STATE.events = STATE.events.filter(e=>{
    if(e.type!=='妊娠鑑定') return true;
    // EVENTS_DATAに存在しないid（手動追加）は削除しない
    if(!invalidPregIds.has(e.id)) return true;
    // EVENTS_DATAに妊娠鑑定がある牛のものは残す
    if(validPregCids.has(Number(e.cattleId))) return true;
    // EVENTS_DATAにある妊娠鑑定で、分娩予定日なしの牛のものは削除
    return false;
  });
  if(STATE.events.length !== beforeLen){
    dirty = true;
  }

  // 2) status補正: 分娩歴なし → 育成中 / 分娩歴あり → 泌乳中以外なら泌乳中
  const birthCids = new Set(STATE.events.filter(e=>e.type==='分娩').map(e=>Number(e.cattleId)));
  STATE.cattle = STATE.cattle.map(cow=>{
    const hasBirth = birthCids.has(Number(cow.id));
    if(!hasBirth && cow.status !== '育成中'){
      dirty = true;
      return {...cow, status:'育成中'};
    }
    return cow;
  });

  // 妊娠鑑定イベントはミルダス取り込みと手動入力を尊重（自動削除しない）

  if(dirty) saveState();
})();

/* ── 繁殖成績計算（eventsから） ── */
function calcReproStats(cattleId){
  const cid = Number(cattleId);
  const evs = STATE.events
    .filter(e=>Number(e.cattleId)===cid)
    .sort((a,b)=>b.date.localeCompare(a.date));

  // 最後の分娩
  const lastBirth = evs.find(e=>e.type==='分娩');
  const _daysSince = ds => Math.round((TODAY - new Date(ds)) / 86400000) + 1; // 分娩・授精日を1日目とするカウント
  const dsc = lastBirth ? _daysSince(lastBirth.date) : null; // 分娩後経過日数
  const virgin = !lastBirth;

  // 分娩後の種付け
  const insemEvs = evs.filter(e=>e.type==='種付け' && (!lastBirth||e.date>lastBirth.date));

  // 通算N回目からinsem取得
  let insem=0;
  insemEvs.forEach(e=>{
    const m=(e.detail||'').match(/通算(\d+)回目/);
    if(m) insem=Math.max(insem,parseInt(m[1]));
  });
  if(insem===0) insem=insemEvs.length;

  const lastInsem = insemEvs[0]||null;
  const dsi = lastInsem ? _daysSince(lastInsem.date) : null; // 最終授精後経過日数

  // 妊娠鑑定・PAG（別々に検索して独立して設定）
  let preg='unknown', pag=null, next=null;
  if(lastInsem){
    // 妊娠鑑定イベント（preg判定用）
    const pregEv=evs.find(e=>e.type==='妊娠鑑定'&&e.date>=lastInsem.date);
    if(pregEv){
      const isPlus=(pregEv.detail||'').includes('＋');
      if(isPlus) preg='positive';
    }
    // PAG検査イベント（pag判定用・妊娠鑑定とは独立）
    const pagEv=evs.find(e=>e.type==='PAG検査'&&e.date>=lastInsem.date);
    if(pagEv){
      const isPlus=(pagEv.detail||'').includes('＋');
      const isMinus=(pagEv.detail||'').includes('－');
      pag=isPlus?'＋':isMinus?'－':null;
      // PAG＋は妊娠確定とはしない（妊娠鑑定＋のみpreg=positive）
    }
    if(preg==='positive') next=addDays(lastInsem.date,285);
  }

  const lastInsemDate = lastInsem ? lastInsem.date : null;
  return {dsc,dsi,insem,preg,pag,next,virgin,lastInsemDate};
}

function buildReproList(){
  return STATE.cattle.map(cow=>{
    const s=calcReproStats(cow.id);
    return {code:cow.number,name:cow.name,cattleId:cow.id,...s};
  });
}

function calcDueDate(cattleId){
  return calcReproStats(cattleId).next;
}

/* ── アラートレベル（分娩） ── */
function alertLevel(d){
  if(d<0)   return {level:'超過', color:'#8B1A1A',bg:'#FFF0F0',icon:'🚨'};
  if(d<=3)  return {level:'直前', color:'#C0626A',bg:'#FFF4F4',icon:'🔴'};
  if(d<=7)  return {level:'要注意',color:'#D4622A',bg:'#FFF8F0',icon:'🟠'};
  if(d<=10) return {level:'確認', color:'#B7902A',bg:'#FFFBF0',icon:'🟡'};
  return null;
}

    const evs=STATE.events.filter(e=>Number(e.cattleId)===Number(cow.id));
    evs.sort((a,b)=>b.date.localeCompare(a.date));

      if(showFrom>TODAY) return false;  // まだ28日未満
      // showFromが今日より前 = 今日時点ですでに超えていた牛

      const appStartKey='pag_app_start';
      if(!localStorage.getItem(appStartKey)){

      const appStart=localStorage.getItem(appStartKey);
      // showFromがappStart以前 = アプリ導入時点ですでに超えていた → 永久除外
      if(showFrom<=new Date(appStart)) return false;
      return true;
    });

    const printLines=targets.map(function(c,i){return (i+1)+'. '+c.name+'（'+c.code+'）授精後'+c.dsi+'日';}).join('\n');

  renderTailPaint(){
    const D=buildReproList();
    // 確認済みコードを取得（当日のみ有効）
    const tpDoneToday=new Set(
      Object.keys(localStorage)
        .filter(k=>k.startsWith('tp_done_'))
        .map(k=>k.replace('tp_done_',''))
    );
    // 条件1: 分娩後55日目以降・未授精（確認済みを押すまで表示し続ける）
    const tp1=D.filter(c=>c.preg!=='positive'&&!c.virgin&&c.dsc!=null&&c.dsc>=55&&c.insem===0&&!tpDoneToday.has(c.code));
    // 条件2: 授精後18日目以降（確認済みを押すまで表示し続ける）
    const tp2=D.filter(c=>c.preg!=='positive'&&c.dsi!=null&&c.dsi>=18&&c.insem>0&&!tpDoneToday.has(c.code));
    const allCodes=new Set(); const tagged=[];
    tp1.forEach(c=>{ if(!allCodes.has(c.code)){allCodes.add(c.code);tagged.push({...c,label:'分娩後55日目',color:'#2E7D32',bg:'#E8F5E9'});}});
    tp2.forEach(c=>{ if(!allCodes.has(c.code)){allCodes.add(c.code);tagged.push({...c,label:'授精後18日目',color:'#1565C0',bg:'#E3F2FD'});}});

    const pending=tagged.filter(c=>!tpDoneToday.has(c.code));
    const done   =tagged.filter(c=> tpDoneToday.has(c.code));
    const printLines=pending.map((c,i)=>`${i+1}. ${c.name}（${c.code}）　${c.label}`).join('\n');

    let html=`<div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

          <div style="font-size:13px;font-weight:800;color:#1B3A5C">🎨 テールペイント対象

            ${done.length>0?`<span style="font-size:12px;color:#7A9AB0;margin-left:6px">（確認済み ${done.length}頭）</span>`:''}
          </div>
          <div style="font-size:10px;color:#7A9AB0;margin-top:2px">分娩後55日目 ${tp1.length}頭　／　授精後18日目 ${tp2.length}頭</div>
        </div>
        <button id="tailpaint-copy-btn" onclick="App.copyTailPaint()" data-lines="${esc(printLines)}" style="background:#EEF2F7;border:none;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#1B3A5C">📋 コピー</button>
      </div>`;

    if(pending.length===0 && done.length===0){
      html+=`<div style="color:#7A9AB0;text-align:center;padding:20px;font-size:13px">本日の対象牛はいません</div>`;
    }

    pending.forEach((c,i)=>{
      const sub=[c.dsc!=null?`分娩後${c.dsc}日`:'',c.insem>0?`授精${c.insem}回`:'未授精',c.dsi!=null?`最終授精後${c.dsi}日`:''].filter(Boolean).join('　');
      html+=`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F4F8">
        <div style="width:24px;height:24px;border-radius:50%;background:${c.color};color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</div>
        <div style="flex:1;cursor:pointer" onclick="App.jumpToKojiki('${c.code}')">
          <div style="font-size:13px;font-weight:800">${esc(c.name)}</div>
          <div style="font-size:11px;color:#7A9AB0;margin-top:1px">${sub}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span style="background:${c.bg};color:${c.color};border-radius:5px;padding:3px 8px;font-size:10px;font-weight:700;white-space:nowrap">${c.label}</span>
          <button onclick="App.tpConfirm('${c.code}')" style="background:#2E7D32;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">✓ 確認済み</button>
        </div>
      </div>`;
    });

    if(done.length>0){
      html+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid #EEF2F7">
        <div style="font-size:11px;color:#7A9AB0;font-weight:700;margin-bottom:6px">✓ 本日確認済み</div>`;
      done.forEach(c=>{

  /* ━ ③ 分娩予定 ━ */
  renderCalving(){
    const D=buildReproList();
    // 妊鑑＋かつ分娩予定あり
    const withDue=D.filter(c=>c.preg==='positive'&&c.next)
      .map(c=>({...c,days:diffDays(c.next)})).sort((a,b)=>a.days-b.days);
    const soon=withDue.filter(c=>c.days<=10&&c.days>=-7);

    let html=`<div class="card"><div class="card-h">🐄 10日以内の分娩予定（妊鑑＋確定）</div>`;
    if(!soon.length) html+=`<div style="color:${C.muted};text-align:center;padding:16px;font-size:13px">10日以内の予定なし</div>`;
    soon.forEach(c=>{
      const col=c.days<0?'#B71C1C':c.days<=3?'#C0626A':c.days<=7?'#E65100':'#B7902A';
      html+=`<div class="calv-item"><div class="calv-dot" style="background:${col}"></div>
        <div class="calv-body"><div class="calv-name">${esc(c.name)} <span style="background:#7B1FA2;color:#fff;border-radius:3px;padding:1px 5px;font-size:9px;font-weight:700">妊鑑＋</span></div>
        <div class="calv-date">${c.next}　${c.code}</div></div>
        <div><div class="calv-days" style="color:${col}">${c.days<0?'+'+Math.abs(c.days):c.days}</div><div class="calv-days-lbl" style="color:${col}">${c.days<0?'日超過':'日後'}</div></div>
      </div>`;
    });

    // 記録帳の種付け+284日
    const kojikiDue=STATE.cattle.map(cow=>{
      const d=calcDueDate(cow.id); if(!d) return null;
      const days=diffDays(d); if(days>10||days<-7) return null;
      return {name:cow.name,code:cow.number,next:d,days};
    }).filter(Boolean).sort((a,b)=>a.days-b.days);

    if(kojikiDue.length){
      html+=`<div style="margin-top:12px;padding-top:12px;border-top:1px solid #EEF2F7"><div style="font-size:11px;color:${C.muted};font-weight:700;margin-bottom:8px">📖 記録帳（種付け+284日）</div>`;
      kojikiDue.forEach(c=>{
        const col=c.days<0?'#B71C1C':'#1565C0';
        html+=`<div class="calv-item"><div class="calv-dot" style="background:${col}"></div>
          <div class="calv-body"><div class="calv-name">${esc(c.name)}</div><div class="calv-date">${c.next}　${c.code}</div></div>
          <div><div class="calv-days" style="color:${col}">${c.days<0?'+'+Math.abs(c.days):c.days}</div><div class="calv-days-lbl" style="color:${col}">${c.days<0?'日超過':'日後'}</div></div>
        </div>`;
      });
      html+='</div>';
    }
    html+='</div>';

    // 月別集計
    const monthly={};
    withDue.forEach(c=>{const m=c.next.slice(0,7);monthly[m]=(monthly[m]||0)+1;});
    const months=Object.keys(monthly).sort().slice(0,8);
    const max=Math.max(...months.map(m=>monthly[m]),1);
    html+=`<div class="card"><div class="card-h">📅 月別分娩予定（妊鑑＋）</div>`;
    months.forEach(m=>{
      const n=monthly[m]; const w=Math.round(n/max*100);
      html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div style="font-size:11px;font-weight:700;min-width:44px">${m.slice(2)}</div>
        <div style="flex:1;background:#EEF2F7;border-radius:4px;height:22px;overflow:hidden"><div style="width:${w}%;background:${C.navy};height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px"><span style="color:#fff;font-size:11px;font-weight:800">${n}頭</span></div></div>
      </div>`;
    });
    html+='</div>';

    qs('#pane-calving').innerHTML=html;
  },

  /* ━ ④ 牛一覧 ━ */
  renderList(){
    const q=(qs('#list-search-inp')||{value:''}).value||'';
    const D=buildReproList();
    const filtered=D.filter(c=>{
      const ms=c.code.includes(q)||c.name.includes(q);
      if(!ms) return false;
      if(LIST_FILTER==='全て') return true;
      if(LIST_FILTER==='妊娠') return c.preg==='positive';
      if(LIST_FILTER==='未授精') return c.preg!=='positive'&&!c.virgin&&c.dsc!=null&&c.dsc>=60&&c.insem===0;
      if(LIST_FILTER==='難受胎') return c.preg!=='positive'&&c.insem>=3;
      if(LIST_FILTER==='長期空胎') return c.preg!=='positive'&&!c.virgin&&c.dsc!=null&&c.dsc>=150;
      return true;
    });

    const prefs=['全て','妊娠','未授精','難受胎','長期空胎'];
    const filterBtns=prefs.map(p=>`<button class="fbtn" style="background:${LIST_FILTER===p?C.navy:C.subtle};color:${LIST_FILTER===p?C.white:C.muted}" onclick="App.setListFilter('${p}')">${p}</button>`).join('');

    const pregTag={positive:'<span class="badge b-preg">妊娠</span>',unknown:'<span class="badge b-unk">不明</span>'};

    // 選択モードUI
    let selBar='';
    if(LIST_SEL_MODE){
      const n=LIST_SEL.size;
      selBar=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0 4px;flex-wrap:wrap">
        <button class="fbtn" style="background:#EEF2F7;color:#37474F" onclick="App.listSelAll(${JSON.stringify(filtered.map(c=>c.code))})">全選択(${filtered.length})</button>
        <button class="fbtn" style="background:#EEF2F7;color:#37474F" onclick="App.listSelNone()">解除</button>
        <span style="font-size:12px;color:${C.navy};font-weight:700;flex:1">${n}頭 選択中</span>
        <button class="fbtn" style="background:${n>0?'#C62828':'#eee'};color:${n>0?C.white:'#aaa'};font-weight:800" onclick="App.listDelSel()" ${n===0?'disabled':''}>🗑 削除</button>
        <button class="fbtn" style="background:#EEF2F7;color:#555" onclick="App.listSelExit()">キャンセル</button>
      </div>`;
    } else {
      selBar=`<div style="padding:4px 0 6px"><button class="fbtn" style="background:#EEF2F7;color:#37474F" onclick="App.listSelEnter()">☑ 複数選択・削除</button></div>`;
    }

    const rows=filtered.map(c=>{
      const sel=LIST_SEL.has(c.code);
      const alerts=[];
      if(ALERT_DEFS[0].check(c)) alerts.push('<span class="badge b-noins">未授精</span>');
      if(ALERT_DEFS[1].check(c)) alerts.push(`<span class="badge b-hard">${c.insem}回</span>`);
      if(ALERT_DEFS[2].check(c)) alerts.push('<span class="badge b-long">長期</span>');
      const nextStr=c.next?c.next.slice(5).replace('-','月')+'日':'-';
      if(LIST_SEL_MODE){
        return `<tr style="${sel?'background:#EDE7F6':''}" onclick="App.listSelToggle('${c.code}')">
          <td style="width:34px;text-align:center;padding:8px 4px"><div style="width:20px;height:20px;border-radius:4px;border:2px solid ${sel?'#4527A0':'#bbb'};background:${sel?'#4527A0':'#fff'};display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin:auto">${sel?'✓':''}</div></td>
          <td><div style="font-weight:700;font-size:12px">${esc(c.code)}</div><div style="font-size:10px;color:${C.muted}">${esc(c.name.slice(0,10))}</div></td>
          <td style="font-size:11px">${c.dsc!=null?c.dsc+'日':c.virgin?'初産':'－'}</td>
          <td>${pregTag[c.preg]||''}</td>
          <td style="font-size:11px">${nextStr}</td>
        </tr>`;
      }
      return `<tr onclick="App.jumpToKojiki('${c.code}')">
        <td><div style="font-weight:700;font-size:12px">${esc(c.code)}</div><div style="font-size:10px;color:${C.muted}">${esc(c.name.slice(0,8))}</div></td>
        <td style="white-space:nowrap">${c.dsc!=null?c.dsc+'日':c.virgin?'初産':'－'}</td>
        <td style="white-space:nowrap">${c.insem}回 ${alerts.join(' ')}</td>
        <td>${pregTag[c.preg]||''}</td>
        <td style="font-size:11px;white-space:nowrap">${nextStr}</td>
      </tr>`;
    }).join('')||`<tr><td colspan="5" style="text-align:center;color:${C.muted};padding:16px">該当なし</td></tr>`;

    qs('#pane-list').innerHTML=`<div class="card" style="padding:10px">
      <input class="search-box" id="list-search-inp" placeholder="🔍 番号・名前で検索" oninput="App.renderList()" value="${esc(q)}">
      <div class="frow">${filterBtns}</div>
      ${selBar}
      <div style="overflow-x:auto">
        <table class="rtbl">
          <thead><tr>${LIST_SEL_MODE?'<th></th>':''}<th>番号</th><th>分娩後</th><th>授精回</th><th>妊鑑</th><th>次回予定</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  },

  setListFilter(f){LIST_FILTER=f;this.renderList();},
  listSelEnter(){LIST_SEL_MODE=true;LIST_SEL.clear();this.renderList();},
  listSelExit(){LIST_SEL_MODE=false;LIST_SEL.clear();this.renderList();},
  listSelToggle(code){LIST_SEL.has(code)?LIST_SEL.delete(code):LIST_SEL.add(code);this.renderList();},
  listSelAll(codes){codes.forEach(c=>LIST_SEL.add(c));this.renderList();},
  listSelNone(){LIST_SEL.clear();this.renderList();},
  listDelSel(){
    const n=LIST_SEL.size; if(!n) return;
    customConfirm(`選択した ${n} 件を削除しますか？\nこの操作は元に戻せません。`,()=>{
      const nums=Array.from(LIST_SEL);
      const ids=STATE.cattle.filter(c=>nums.includes(c.number)).map(c=>Number(c.id));
      STATE.cattle=STATE.cattle.filter(c=>!nums.includes(c.number));
      STATE.events=STATE.events.filter(e=>!ids.includes(Number(e.cattleId)));
      saveState(); LIST_SEL_MODE=false; LIST_SEL.clear();
      this.renderList(); showToast(`${n}件を削除しました`);
    });
  },

  jumpToKojiki(code){
    KOJIKI_SEARCH=code;
    SELECTED_COW=null;
    // タブを切り替え
    CURRENT_TAB='kojiki';
    ['dash','alert','calving','list','kojiki','today','treatment','calendar'].forEach((t,i)=>{
      const pane=qs('#pane-'+t);
      if(pane) pane.classList.toggle('hidden',t!=='kojiki');
      const tab=document.querySelectorAll('.tab')[i];
      if(tab) tab.classList.toggle('on',t==='kojiki');
    });
    // 一覧を表示してから検索結果を反映
    qs('#kojiki-list-view').classList.remove('hidden');
    qs('#kojiki-detail-view').classList.add('hidden');
    this.renderKojikiList();
  },

  /* ━ ⑤ 記録帳 ━ */
  renderKojiki(){
    if(SELECTED_COW){
      qs('#kojiki-list-view').classList.add('hidden');
      qs('#kojiki-detail-view').classList.remove('hidden');
      this.renderDetail(SELECTED_COW);
    } else {
      qs('#kojiki-list-view').classList.remove('hidden');
      qs('#kojiki-detail-view').classList.add('hidden');
      this.renderKojikiList();
    }
  },

  renderKojikiList(){
    const q=KOJIKI_SEARCH;
    // 分娩アラート（記録帳の妊鑑＋牛）
    const alerts=STATE.cattle.map(cow=>{
      const d=calcDueDate(cow.id); if(!d) return null;
      const days=diffDays(d); const al=alertLevel(days); if(!al) return null;
      return {cow,d,days,...al};
    }).filter(Boolean).sort((a,b)=>a.days-b.days);

    // 妊鑑予定牛（授精後60日以上・妊鑑未）
    const pregCheckDue=STATE.cattle.map(cow=>{
      const s=calcReproStats(cow.id);
      if(s.preg==='positive') return null;
      if(!s.dsi||s.dsi<60) return null;
      return {cow,days:s.dsi};
    }).filter(Boolean);

    // サマリー
    const dueSoon=STATE.cattle.filter(c=>{const d=calcDueDate(c.id);return d&&diffDays(d)<=10;}).length;
    const pregCheck=STATE.cattle.filter(c=>{const s=calcReproStats(c.id);return s.dsi!=null&&s.dsi>=60&&s.preg!=='positive';}).length;
    const recent=STATE.events.filter(e=>(Date.now()-new Date(e.date))/86400000<=30);

    // 選択モードUI
    const shown=STATE.cattle.filter(cow=>{
      const ms=cow.number.includes(q)||cow.name.includes(q);
      return ms&&(KOJIKI_STATUS==='全て'||cow.status===KOJIKI_STATUS);
    });
    let selBar='';
    if(KOJI_SEL_MODE){
      const n=KOJI_SEL.size;
      selBar=`<div style="display:flex;align-items:center;gap:8px;padding:6px 0 8px;flex-wrap:wrap">
        <button class="fbtn" style="background:#EEF2F7;color:#37474F" onclick="App.kojiSelAll(${JSON.stringify(shown.map(c=>c.id))})">全選択(${shown.length})</button>
        <button class="fbtn" style="background:#EEF2F7;color:#37474F" onclick="App.kojiSelNone()">解除</button>
        <span style="font-size:12px;color:${C.navy};font-weight:700;flex:1">${n}頭 選択中</span>
        <button class="fbtn" style="background:${n>0?'#C62828':'#eee'};color:${n>0?C.white:'#aaa'};font-weight:800" onclick="App.kojiDelSel()" ${n===0?'disabled':''}>🗑 削除</button>
        <button class="fbtn" style="background:#EEF2F7;color:#555" onclick="App.kojiSelExit()">キャンセル</button>
      </div>`;
    } else {
      selBar=`<div style="padding:4px 0 6px"><button class="fbtn" style="background:#EEF2F7;color:#37474F" onclick="App.kojiSelEnter()">☑ 複数選択・削除</button></div>`;
    }

    // ステータスフィルター
    const stFilt=['全て',...STATUSES].map(s=>`<button class="fbtn" style="background:${KOJIKI_STATUS===s?C.navy:C.subtle};color:${KOJIKI_STATUS===s?C.white:C.muted}" onclick="App.setKojiStatus('${s}')">${s}</button>`).join('');

    // 分娩アラートHTML
    let baHtml='';
    if(alerts.length){
      baHtml=`<div style="background:#FFF4F4;border:2px solid #C0626A33;border-radius:12px;overflow:hidden;margin-bottom:10px">
        <div style="background:#C0626A;padding:10px 16px;display:flex;align-items:center;gap:8px">
          <span style="font-size:16px">🐄</span><span style="color:#fff;font-weight:800;font-size:14px">分娩予定アラート</span>
          <span style="background:#fff;color:#C0626A;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:800">${alerts.length}頭</span>
        </div><div style="padding:10px 12px">`;
      alerts.forEach(({cow,d,days,level,color,bg,icon})=>{
        baHtml+=`<div style="background:${bg};border:1.5px solid ${color}44;border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:6px" onclick="App.selectCow(${cow.id})">
          <div style="text-align:center;min-width:40px"><div style="font-size:17px">${icon}</div><div style="font-size:10px;color:${color};font-weight:800">${level}</div></div>
          <div style="flex:1"><div style="font-weight:900;font-size:14px;color:${C.navy}">${esc(cow.name)}</div><div style="font-size:12px;color:${C.muted}">予定日：<strong>${d}</strong>　<span style="color:#7B1FA2;font-weight:700">🔍 妊鑑＋</span></div></div>
          <div style="text-align:right;min-width:50px"><div style="font-size:22px;font-weight:900;color:${color};line-height:1">${days<0?'+'+Math.abs(days):days}</div><div style="font-size:10px;color:${color};font-weight:700">${days<0?'日超過':'日後'}</div></div>
        </div>`;
      });
      baHtml+=`</div><div style="padding:4px 14px 10px;font-size:11px;color:${C.muted}">※ 妊鑑＋記録あり・種付け+284日で算出</div></div>`;
    }
    if(pregCheckDue.length){
      baHtml+=`<div style="background:#F3E5F5;border:2px solid #7B1FA233;border-radius:12px;overflow:hidden;margin-bottom:10px">
        <div style="background:#7B1FA2;padding:10px 16px;display:flex;align-items:center;gap:8px">
          <span style="font-size:16px">🔍</span><span style="color:#fff;font-weight:800;font-size:14px">妊娠鑑定 予定牛</span>
          <span style="background:#fff;color:#7B1FA2;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:800">${pregCheckDue.length}頭</span>
        </div><div style="padding:10px 12px">`;
      pregCheckDue.sort((a,b)=>b.days-a.days).forEach(({cow,days})=>{
        const urg=days>=90?{color:'#B71C1C',bg:'#FFEBEE',icon:'🔴'}:days>=75?{color:'#E65100',bg:'#FFF3E0',icon:'🟠'}:{color:'#B7902A',bg:'#FFFBF0',icon:'🟡'};
        baHtml+=`<div style="background:${urg.bg};border:1.5px solid ${urg.color}44;border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:6px" onclick="App.selectCow(${cow.id})">
          <div style="text-align:center;min-width:40px"><div style="font-size:17px">${urg.icon}</div><div style="font-size:10px;color:${urg.color};font-weight:800">要鑑定</div></div>
          <div style="flex:1"><div style="font-weight:900;font-size:14px;color:${C.navy}">${esc(cow.name)}</div></div>
          <div style="text-align:right;min-width:50px"><div style="font-size:22px;font-weight:900;color:${urg.color};line-height:1">${days}</div><div style="font-size:10px;color:${urg.color};font-weight:700">日経過</div></div>
        </div>`;
      });
      baHtml+=`</div><div style="padding:4px 14px 10px;font-size:11px;color:${C.muted}">※ 最終授精から60日以上・妊鑑未実施</div></div>`;
    }

    // 牛カードHTML
    let cowHtml='';
    if(!shown.length) cowHtml=`<div style="color:${C.muted};text-align:center;padding:32px">該当する牛が見つかりません</div>`;
    shown.forEach(cow=>{
      const stats=calcReproStats(cow.id);
      const lastEv=STATE.events.filter(e=>Number(e.cattleId)===Number(cow.id)).sort((a,b)=>b.date.localeCompare(a.date))[0];
      const scol=STATUS_COLOR[cow.status]||C.muted;
      const sel=KOJI_SEL.has(Number(cow.id));
      let dueHtml='';
      if(stats.next){
        const days=diffDays(stats.next); const al=alertLevel(days)||{level:'予定あり',color:C.sky,bg:'#F0F8FF',icon:'📅'};
        dueHtml=`<div style="background:${al.bg};border:1px solid ${al.color}44;border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px">
          <span>${al.icon}</span><span style="color:${al.color};font-weight:700">${al.level}</span>
          <span style="color:${C.muted}">分娩予定 ${stats.next}</span>
          <span style="margin-left:auto;font-weight:800;color:${al.color}">${days<0?Math.abs(days)+'日超過':days+'日後'}</span></div>`;
      }
      const lastHtml=lastEv?`<div style="font-size:11px;background:#F8FAF8;border-radius:5px;padding:5px 8px"><span style="color:${TYPE_COLOR[lastEv.type]||C.muted}">${TYPE_ICON[lastEv.type]||'📝'} ${lastEv.type}</span><span style="color:${C.muted}"> · ${lastEv.date}</span></div>`:'';

      if(KOJI_SEL_MODE){
        cowHtml+=`<div class="cow-card" style="border-left-color:${scol};background:${sel?'#EDE7F6':'#fff'};display:flex;align-items:center;gap:10px" onclick="App.kojiSelToggle(${cow.id})">
          <div style="width:24px;height:24px;border-radius:5px;border:2px solid ${sel?'#4527A0':'#bbb'};background:${sel?'#4527A0':'#fff'};display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0">${sel?'✓':''}</div>
          <div style="flex:1;min-width:0"><div style="font-size:11px;color:${C.muted};font-weight:600">${esc(cow.number)}</div>
          <div style="font-size:15px;font-weight:800;color:${C.navy};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(cow.name)}</div>
          <div style="font-size:12px;color:${C.muted}">${esc(cow.breed)}　${cow.status}</div>
          ${STATE.events.filter(e=>Number(e.cattleId)===Number(cow.id)).length>0?`<div style="font-size:11px;color:#C0626A;margin-top:2px">記録 ${STATE.events.filter(e=>Number(e.cattleId)===Number(cow.id)).length}件</div>`:''}</div>
        </div>`;
      } else {
        cowHtml+=`<div class="cow-card" style="border-left-color:${scol}" onclick="App.selectCow(${cow.id})">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
            <div><div style="font-size:11px;color:${C.muted};font-weight:600">${esc(cow.number)}</div><div style="font-size:16px;font-weight:800;color:${C.navy}">${esc(cow.name)}</div></div>
            <span class="badge" style="background:${scol}22;color:${scol};border:1px solid ${scol}55">${cow.status}</span>
          </div>
          <div style="font-size:12px;color:${C.muted};margin-bottom:${dueHtml||lastHtml?8:0}px">${esc(cow.breed)}　生後 ${age(cow.birthdate)}</div>
          ${dueHtml}${lastHtml}
        </div>`;
      }
    });

    // 検索欄・フィルター・選択モードが既にある場合は更新しない（フォーカス維持）
    const lv = qs('#kojiki-list-view');
    if(!lv) return;
    // 初回または完全再描画が必要な場合
    if(!qs('#kojiki-search-inp')){
      lv.innerHTML=`
        <input class="search-box" id="kojiki-search-inp" placeholder="🔍 番号・名前で検索"
          oninput="KOJIKI_SEARCH=this.value;App.renderKojikiBody()"
          value="${esc(q)}">
        <div class="frow" id="koji-status-filt">${stFilt}</div>
        <div id="koji-sel-bar">${selBar}</div>
        <div id="koji-body"></div>`;
    } else {
      qs('#koji-status-filt').innerHTML=stFilt;
      qs('#koji-sel-bar').innerHTML=selBar;
    }
    // bodyだけ更新
    const bodyEl=qs('#koji-body');
    if(bodyEl){
      bodyEl.innerHTML=baHtml+`<div class="sg">
        <div class="sg-item"><div class="sg-label">管理頭数</div><div class="sg-val" style="color:${C.navy}">${STATE.cattle.length}頭</div><div class="sg-sub">登録中</div></div>
        <div class="sg-item"><div class="sg-label">10日以内分娩</div><div class="sg-val" style="color:${C.rose}">${dueSoon}頭</div><div class="sg-sub">妊鑑＋確定</div></div>
        <div class="sg-item"><div class="sg-label">妊鑑予定</div><div class="sg-val" style="color:#7B1FA2">${pregCheck}頭</div><div class="sg-sub">60日以上経過</div></div>
        <div class="sg-item"><div class="sg-label">今月種付け</div><div class="sg-val" style="color:${C.sky}">${recent.filter(e=>e.type==='種付け').length}件</div><div class="sg-sub">30日以内</div></div>
      </div>${cowHtml}`;
    }
  },

  renderKojikiBody(){ this.renderKojikiList(); },
  setKojiStatus(s){KOJIKI_STATUS=s;this.renderKojikiList();},
  kojiSelEnter(){KOJI_SEL_MODE=true;KOJI_SEL.clear();this.renderKojikiList();},
  kojiSelExit(){KOJI_SEL_MODE=false;KOJI_SEL.clear();this.renderKojikiList();},
  kojiSelToggle(id){id=Number(id);KOJI_SEL.has(id)?KOJI_SEL.delete(id):KOJI_SEL.add(id);this.renderKojikiList();},
  kojiSelAll(ids){ids.forEach(id=>KOJI_SEL.add(Number(id)));this.renderKojikiList();},
  kojiSelNone(){KOJI_SEL.clear();this.renderKojikiList();},
  kojiDelSel(){
    const n=KOJI_SEL.size; if(!n) return;
    const withEv=Array.from(KOJI_SEL).filter(id=>STATE.events.some(e=>Number(e.cattleId)===id));
    const warn=withEv.length?`\n（うち${withEv.length}頭は記録があります）`:'';
    customConfirm(`選択した ${n}頭を削除しますか？${warn}\nこの操作は元に戻せません。`,()=>{
      STATE.cattle=STATE.cattle.filter(c=>!KOJI_SEL.has(Number(c.id)));
      STATE.events=STATE.events.filter(e=>!KOJI_SEL.has(Number(e.cattleId)));
      saveState(); KOJI_SEL_MODE=false; KOJI_SEL.clear();
      SELECTED_COW=null; this.renderKojikiList(); showToast(`${n}頭を削除しました`);
    });
  },

  selectCow(id){
    SELECTED_COW=STATE.cattle.find(c=>Number(c.id)===Number(id));
    qs('#kojiki-list-view').classList.add('hidden');
    qs('#kojiki-detail-view').classList.remove('hidden');
    this.renderDetail(SELECTED_COW);
  },

  backToList(){
    SELECTED_COW=null;
    qs('#kojiki-list-view').classList.remove('hidden');
    qs('#kojiki-detail-view').classList.add('hidden');
    this.renderKojikiList();
  },

  renderDetail(cow){
    const evs=STATE.events.filter(e=>Number(e.cattleId)===Number(cow.id)).sort((a,b)=>b.date.localeCompare(a.date));
    const stats=calcReproStats(cow.id);
    const scol=STATUS_COLOR[cow.status]||C.muted;

    let dueHtml='';
    if(stats.next){
      const days=diffDays(stats.next); const al=alertLevel(days)||{level:'予定あり',color:C.sky,bg:'#F0F8FF',icon:'📅'};
      dueHtml=`<div style="background:${al.bg};border:1.5px solid ${al.color}44;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:20px">${al.icon}</span>
        <div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
          <div style="font-size:11px;color:${al.color};font-weight:800">${al.level}</div>
          <span style="background:#7B1FA2;color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700">🔍 妊鑑＋確定</span>
        </div>
        <div style="font-size:13px">分娩予定：<strong>${stats.next}</strong>　<span style="color:${al.color};font-weight:700">${days<0?Math.abs(days)+'日超過':'あと'+days+'日'}</span></div>
      </div></div>`;
    } else if(stats.dsi!=null&&stats.dsi>=60&&stats.preg!=='positive'){
      const urg=stats.dsi>=90?{color:'#B71C1C',bg:'#FFEBEE',icon:'🔴'}:stats.dsi>=75?{color:'#E65100',bg:'#FFF3E0',icon:'🟠'}:{color:'#B7902A',bg:'#FFFBF0',icon:'🟡'};
      dueHtml=`<div style="background:${urg.bg};border:1.5px solid ${urg.color}44;border-radius:8px;padding:10px 12px;margin-bottom:8px">
        <div style="font-size:11px;color:${urg.color};font-weight:800">${urg.icon} 妊娠鑑定 未実施</div>
        <div style="font-size:13px;margin-top:4px">授精後<strong style="color:${urg.color}">${stats.dsi}日</strong>経過　妊娠鑑定を実施してください</div>
      </div>`;
    }

    // タイムライン
    let tl='';
    evs.forEach((ev,i)=>{
      const tc=TYPE_COLOR[ev.type]||C.muted; const ti=TYPE_ICON[ev.type]||'📝';
      const plusBadge=(ev.type==='妊娠鑑定'||ev.type==='PAG検査')&&(ev.detail||'').includes('＋')?`<span style="background:#2E7D32;color:#fff;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:900">＋</span>`:'';
      const minusBadge=(ev.type==='妊娠鑑定'||ev.type==='PAG検査')&&(ev.detail||'').includes('－')?`<span style="background:#C62828;color:#fff;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:900">－</span>`:'';
      tl+=`<div class="tl-wrap" style="margin-bottom:2px">
        <div class="tl-line"><div class="tl-dot" style="background:${tc}22;border:2px solid ${tc}">${ti}</div>${i<evs.length-1?'<div class="tl-seg"></div>':''}</div>
        <div class="card" style="flex:1;padding:10px 12px;margin-bottom:2px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div style="display:flex;gap:6px;align-items:center">
              <span class="badge" style="background:${tc}22;color:${tc};border:1px solid ${tc}55">${ev.type}</span>
              ${plusBadge}${minusBadge}
              ${ev.vet?`<span style="font-size:11px;color:${C.muted}">${esc(ev.vet)}</span>`:''}
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <span style="font-size:11px;color:${C.muted}">${ev.date}</span>
              <button onclick="App.deleteEvent(${ev.id})" style="background:none;border:none;color:${C.muted};cursor:pointer;font-size:16px;padding:0;line-height:1">✕</button>
            </div>
          </div>
          <div style="font-size:13px;color:${C.text};line-height:1.6">${esc(ev.detail)}</div>
        </div>
      </div>`;
    });

    qs('#kojiki-detail-view').innerHTML=`
      <button onclick="App.backToList()" style="background:none;border:none;color:${C.muted};font-size:14px;cursor:pointer;margin-bottom:14px;padding:0;font-weight:600">← 一覧に戻る</button>
      <div class="card" style="margin-bottom:14px;border-left:5px solid ${scol}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <div><div style="font-size:11px;color:${C.muted};font-weight:600">${esc(cow.number)}</div>
          <div style="font-size:24px;font-weight:900;color:${C.navy}">${esc(cow.name)}</div></div>
          <span class="badge" style="background:${scol}22;color:${scol};border:1px solid ${scol}55">${cow.status}</span>
        </div>
        <div style="font-size:12px;color:${C.muted};margin-bottom:8px">${esc(cow.breed)}　生後 ${age(cow.birthdate)}（${cow.birthdate}）</div>
        ${cow.notes?`<div style="font-size:13px;color:${C.muted};background:#F8FAF8;border-radius:6px;padding:8px 10px;margin-bottom:8px">📝 ${esc(cow.notes)}</div>`:''}
        ${dueHtml}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" onclick="App.openCattleModal(STATE.cattle.find(c=>Number(c.id)===${cow.id}))">編集</button>
          <button class="btn btn-danger btn-sm" onclick="App.deleteCow(${cow.id})">削除</button>
          <button class="btn btn-primary btn-sm" onclick="App.openEventModal(STATE.cattle.find(c=>Number(c.id)===${cow.id}))">＋ 記録追加</button>
        </div>
      </div>

  parseMildas(text){
    const idP=/^\d{5} \d{4} \d$/;
    const records=[];
    // ブロック分割（各牛は「5桁 4桁 1桁」で始まる）
    const blocks=text.split(/(?=\d{5} \d{4} \d)/);
    blocks.forEach(function(block){
      const lines=block.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
      if(!lines.length) return;
      if(!idP.test(lines[0])) return;
      const code=lines[0].split(' ')[1];
      const r={code,分娩日:null,産次:0,最終授精日:null,回数:null,妊鑑:null,PAG:null,分娩予定日:null,名号:null};

      // 分娩日
      var birthM=block.match(/(\d{4}\/\d{2}\/\d{2}) 分娩(\d+) 産/);
      if(birthM){r.分娩日=birthM[1];r.産次=parseInt(birthM[2]);}

      // 最終授精日・回数
      var insemM=block.match(/(\d{4}\/\d{2}\/\d{2}) 授精(\d+) 回/);
      if(insemM){r.最終授精日=insemM[1];r.回数=parseInt(insemM[2]);}

      // 妊鑑PAG行を正確に解析
      // フォーマット: 妊鑑( ＋ )PAG( ＋ ) or 妊鑑PAG( ＋ ) or 妊鑑( ＋ )PAG or 妊鑑PAG
      var pregLine=null;
      for(var i=0;i<lines.length;i++){
        if(lines[i].indexOf('妊鑑')>=0 && lines[i].indexOf('PAG')>=0){pregLine=lines[i];break;}
      }
      if(pregLine){
        // 妊鑑とPAGの間にある値を妊鑑として取得
        var pregM=pregLine.match(/妊鑑\s*(?:\(\s*([＋－]+)\s*\))?\s*PAG\s*(?:\(\s*([＋－]+)\s*\))?/);
        if(pregM){
          r.妊鑑=pregM[1]||null;  // 妊鑑の後の値（なければnull）
          r.PAG=pregM[2]||null;   // PAGの後の値（なければnull）
        }
        // 分娩予定日
        var nextM=pregLine.match(/(\d{4}\/\d{2}\/\d{2})\s*予定/);
        if(nextM) r.分娩予定日=nextM[1];
      }

      // 名号（最終行）
      var lastLine=lines[lines.length-1];
      if(!idP.test(lastLine) && !/^\d{4}\/\d{2}\/\d{2}/.test(lastLine) && !/^\d+(\.\d+)?\s*(日|産)?$/.test(lastLine)){
        r.名号=lastLine;
      }

      records.push(r);
    });
    return records;
  },

  importMildas(){
    const text=qs('#mildas-input').value.trim();
    if(!text){showToast('データを貼り付けてください');return;}
    const records=this.parseMildas(text);
    if(!records.length){showToast('データを読み取れませんでした');return;}

    const today=new Date(); today.setHours(0,0,0,0);
    const daySince=d=>{if(!d)return null;const dt=new Date(d.replace(/\//g,'-'));dt.setHours(0,0,0,0);return Math.round((today-dt)/86400000)+1;};
    const addD=(ds,n)=>{const d=new Date(ds.replace(/\//g,'-'));d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};

    let addedCattle=0, updatedEvents=0;

    records.forEach(r=>{
      // cattleに存在するか確認
      const deletedCattle=JSON.parse(localStorage.getItem('deleted_cattle')||'[]');
      if(deletedCattle.includes(r.code)) return; // 削除済みの牛はスキップ
      let cow=STATE.cattle.find(c=>c.number===r.code);
      if(!cow){
        // 新規追加
        const newId=Math.max(0,...STATE.cattle.map(c=>Number(c.id)))+1;
        cow={id:newId,number:r.code,name:r.名号||r.code,breed:'ホルスタイン',
             birthdate:'2000-01-01',sex:'雌',
             status:r.産次===0?'育成中':'泌乳中',notes:''};
        STATE.cattle.push(cow);
        addedCattle++;
      }

      const cid=Number(cow.id);
      // 今日の日付
      const todayStr=today.toISOString().slice(0,10);

      // 治療・検査・その他は保持
      // 分娩・種付け・妊娠鑑定・PAG検査はミルダスで更新
      // ただし今日入力した（今日の日付の）手動入力は保持する
      const mildasTypes=['分娩','種付け','妊娠鑑定','PAG検査'];
      // 手動入力フラグがあるものは保持対象
      STATE.events=STATE.events.filter(e=>{
        if(Number(e.cattleId)!==cid) return true;       // 別の牛は保持
        if(!mildasTypes.includes(e.type)) return true;  // 治療・検査等は保持
        if(e.manual) return true;                        // 手動入力は保持
        // ミルダス由来（またはフラグなし）は日付に関係なく削除して上書き
        return false;
      });

      let maxId=Math.max(0,...STATE.events.map(e=>e.id));

      // 分娩イベント追加
      if(r.分娩日 && r.産次>0){
        const bdate=r.分娩日.replace(/\//g,'-');
        maxId++;
        STATE.events.push({id:maxId,cattleId:cid,date:bdate,type:'分娩',detail:r.産次+'産目',vet:''});
        updatedEvents++;
      }

      // 種付けイベント追加
      if(r.最終授精日 && r.回数){
        const idate=r.最終授精日.replace(/\//g,'-');
        maxId++;
        STATE.events.push({id:maxId,cattleId:cid,date:idate,type:'種付け',detail:'人工授精（通算'+r.回数+'回目）',vet:''});
        updatedEvents++;
      }

      // 妊娠鑑定イベント追加（妊鑑フィールドに値がある場合のみ）
      // 妊鑑( ＋ )PAG → 妊鑑あり、妊鑑PAG( ＋ ) → 妊鑑なし（PAGのみ）
      if(r.妊鑑 && r.最終授精日){
        const idate=r.最終授精日.replace(/\//g,'-');
        const pdate=addD(idate,60);
        const isPlus=r.妊鑑.includes('＋');
        maxId++;
        STATE.events.push({id:maxId,cattleId:cid,date:pdate,type:'妊娠鑑定',
          detail:'妊娠鑑定　'+(isPlus?'陽性（＋）':'陰性（－）'),vet:''});
        updatedEvents++;
      }

      // PAG検査イベント追加
      if(r.PAG && r.最終授精日){
        const idate=r.最終授精日.replace(/\//g,'-');
        const pdate=addD(idate,30);
        const isPlus=r.PAG.includes('＋');
        maxId++;
        STATE.events.push({id:maxId,cattleId:cid,date:pdate,type:'PAG検査',
          detail:'PAG検査　'+(isPlus?'陽性（＋）':'陰性（－）'),vet:''});
        updatedEvents++;
      }
    });

    saveState();
    this.closeModal();
    this.tab(CURRENT_TAB);
    showToast(`取り込み完了：${records.length}頭（新規${addedCattle}頭・記録${updatedEvents}件更新）`);
  },

  importCattleInfo(){
    const text=qs('#cattle-info-input').value.trim();
    if(!text){ showToast('テキストを貼り付けてください'); return; }

    const blocks=text.split(/(?=\(牛ｺｰﾄﾞ\s+\d+\s*\))/).filter(b=>b.trim());
    if(!blocks.length){ showToast('個体情報が見つかりません'); return; }

    let added=0, updated=0;
    const deletedNums=JSON.parse(localStorage.getItem('deleted_cattle')||'[]');

    blocks.forEach(block=>{
      const lines=block.split('\n').map(l=>l.trim()).filter(Boolean);

      const codeMatch=block.match(/\(牛ｺｰﾄﾞ\s+(\d+)\s*\)/);
      if(!codeMatch) return;
      const number=codeMatch[1];
      if(deletedNums.includes(number)) return;
      // 3189以降はドリームランドが名前に入っている牛のみ取り込む
      if(Number(number)>=3189 && !block.includes('ﾄﾞﾘ-ﾑﾗﾝﾄﾞ')) return;

      const nameLine=lines.find(l=>l.startsWith(number+' ')||l.startsWith(number+'\u3000'));
      const name=nameLine||number;

      const bdMatch=block.match(/(\d{4})\/(\d{2})\/(\d{2})出生/);
      const birthdate=bdMatch?bdMatch[1]+'-'+bdMatch[2]+'-'+bdMatch[3]:'';

      const sexMatch=block.match(/性別[：:]\s*(メス|オス)/);
      const sex=sexMatch?(sexMatch[1]==='メス'?'雌':'雄'):'雌';

      let breed='ホルスタイン';
      if(block.includes('交雑')) breed='交雑種';
      else if(block.includes('ジャージー')) breed='ジャージー';

      const lastNumLine=lines.filter(l=>/^\d+\s+\d+\s+\d+$/.test(l)).pop();
      let motherNum='';
      if(lastNumLine){
        const parts=lastNumLine.split(/\s+/);
        if(parts.length>=2) motherNum=parts[1];
      }
      const notes=motherNum?'母牛：'+motherNum:'';

      const existing=STATE.cattle.find(c=>c.number===number);
      if(existing){
        existing.name=name;
        if(birthdate) existing.birthdate=birthdate;
        if(notes) existing.notes=notes;
        updated++;
      } else {
        const newId=Math.max(0,...STATE.cattle.map(c=>c.id))+1;
        STATE.cattle.push({id:newId,number,name,breed,birthdate,sex,status:'育成中',notes});
        added++;
      }
    });

    saveState();
    this.closeModal();
    this.tab(CURRENT_TAB);
    showToast('個体情報取り込み完了：新規'+added+'頭・更新'+updated+'頭');
  },

  exportData(){
    const data={
      version:2,
      exportDate:new Date().toISOString().slice(0,10),
      cattle:STATE.cattle,
      events:STATE.events
    };
    const json=JSON.stringify(data,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='dairy_repro_backup_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('バックアップを保存しました');
  },

  handleImport(input){
    const file=input.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        if(!data.cattle||!data.events){
          showToast('ファイルの形式が正しくありません');
          return;
        }
        customConfirm(
          `バックアップ（${data.exportDate||'不明'}）から復元しますか？\n現在のデータは上書きされます。`,
          ()=>{
            STATE.cattle=data.cattle;
            STATE.events=data.events;
            saveState();
            this.closeModal();
            this.tab(CURRENT_TAB);
            showToast(`復元完了：${data.cattle.length}頭・${data.events.length}件`);
          },
          'OK','#1B3A5C'
        );
      }catch{
        showToast('ファイルの読み込みに失敗しました');
      }
    };
    reader.readAsText(file);
  },

  /* ━ 分娩予定カレンダー ━ */
  _calYear: null,
  _calMonth: null,

  renderCalendar(year, month){
    const now = TODAY;
    if(year==null)  year  = this._calYear  || now.getFullYear();
    if(month==null) month = this._calMonth || now.getMonth();
    this._calYear=year; this._calMonth=month;

    // 妊鑑+の牛の分娩予定日を収集
    const dueMap={};
    buildReproList().forEach(c=>{
      if(c.preg==='positive'&&c.next){
        if(!dueMap[c.next]) dueMap[c.next]=[];
        dueMap[c.next].push({name:c.name,code:c.code});
      }
    });

    const firstDay=new Date(year,month,1);
    const lastDay=new Date(year,month+1,0);
    const startDow=firstDay.getDay();
    const totalDays=lastDay.getDate();
    const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    const dowNames=['日','月','火','水','木','金','土'];
    const dowColors=['#C62828','#37474F','#37474F','#37474F','#37474F','#37474F','#1565C0'];

    let monthTotal=0;
    for(let d=1;d<=totalDays;d++){
      const k=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      if(dueMap[k]) monthTotal+=dueMap[k].length;
    }

    let html='';

    // ヘッダー
    html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">';
    html+='<button onclick="App.calPrev()" style="background:#EEF2F7;border:none;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer">‹</button>';
    html+='<div style="text-align:center">';
    html+='<div style="font-size:18px;font-weight:900;color:#1B3A5C">'+year+'年 '+monthNames[month]+'</div>';
    html+='<div style="font-size:11px;color:#7A9AB0;margin-top:2px">分娩予定 '+monthTotal+'頭</div>';
    html+='</div>';
    html+='<button onclick="App.calNext()" style="background:#EEF2F7;border:none;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer">›</button>';
    html+='</div>';

    // 曜日ヘッダー
    html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">';
    dowNames.forEach(function(d,i){
      html+='<div style="text-align:center;font-size:11px;font-weight:700;padding:4px 0;color:'+dowColors[i]+'">'+d+'</div>';
    });
    html+='</div>';

    // 日付グリッド
    html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:14px">';
    for(let i=0;i<startDow;i++) html+='<div style="min-height:52px"></div>';
    for(let d=1;d<=totalDays;d++){
      const k=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const cows=dueMap[k]||[];
      const isToday=(year===now.getFullYear()&&month===now.getMonth()&&d===now.getDate());
      const dow=(startDow+d-1)%7;
      const textColor=dowColors[dow];
      const bgColor=isToday?'#1B3A5C':cows.length?'#E8F5E9':'transparent';
      const numColor=isToday?'#fff':textColor;
      html+='<div onclick="App.calDayTap(\''+k+'\')" style="min-height:52px;border-radius:8px;background:'+bgColor+';padding:4px;cursor:'+(cows.length?'pointer':'default')+';border:'+(isToday?'none':'1px solid #F0F4F8')+'">';
      html+='<div style="font-size:12px;font-weight:'+(isToday?'900':'600')+';color:'+numColor+';text-align:center">'+d+'</div>';
      if(cows.length){
        html+='<div style="text-align:center;margin-top:2px"><span style="font-size:13px">🐄</span></div>';
        html+='<div style="text-align:center;font-size:10px;font-weight:800;color:#2E7D32">'+cows.length+'頭</div>';
      }
      html+='</div>';
    }
    html+='</div>';

    // 今月の分娩予定一覧
    const monthList=[];
    for(let d=1;d<=totalDays;d++){
      const k=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      if(dueMap[k]) dueMap[k].forEach(function(c){ monthList.push({date:k,d:d,name:c.name,code:c.code}); });
    }

    if(monthList.length){
      html+='<div class="card"><div class="card-h">🐄 '+monthNames[month]+'の分娩予定（'+monthList.length+'頭）</div>';
      monthList.forEach(function(c){
        const days=Math.round((new Date(c.date)-now)/86400000);
        const col=days<0?'#B71C1C':days<=3?'#C0626A':days<=7?'#E65100':'#2E7D32';
        const dayLabel=days<0?Math.abs(days)+'日超過':days===0?'本日':days+'日後';
        html+='<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F0F4F8;cursor:pointer" onclick="App.jumpToKojiki(\''+c.code+'\')">';
        html+='<div style="font-size:11px;font-weight:700;color:'+col+';min-width:36px;text-align:center">'+c.d+'日</div>';
        html+='<div style="flex:1"><div style="font-size:13px;font-weight:800">'+esc(c.name)+'</div>';
        html+='<div style="font-size:11px;color:#7A9AB0">'+c.code+'</div></div>';
        html+='<div style="font-size:11px;font-weight:700;color:'+col+'">'+dayLabel+'</div>';
        html+='</div>';
      });
      html+='</div>';
    } else {
      html+='<div style="color:#7A9AB0;text-align:center;padding:20px;font-size:13px">この月の分娩予定はありません</div>';
    }

    qs('#pane-calendar').innerHTML=html;
  },

  calPrev(){
    let m=this._calMonth-1, y=this._calYear;
    if(m<0){m=11;y--;}
    this.renderCalendar(y,m);
  },
  calNext(){
    let m=this._calMonth+1, y=this._calYear;
    if(m>11){m=0;y++;}
    this.renderCalendar(y,m);
  },

  calDayTap(dateStr){
    const D=buildReproList();
    const cows=D.filter(c=>c.preg==='positive'&&c.next===dateStr);
    if(!cows.length) return;
    const d=new Date(dateStr);
    const label=`${d.getMonth()+1}月${d.getDate()}日の分娩予定`;
    let html=`<div class="sheet-hdr"><h3 class="sheet-title">🐄 ${label}</h3><button class="sheet-close" onclick="App.closeModal()">✕</button></div>`;
    cows.forEach(c=>{
      html+=`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F4F8;cursor:pointer"
        onclick="App.closeModal();App.jumpToKojiki('${c.code}')">
        <div style="flex:1">
          <div style="font-size:15px;font-weight:800">${esc(c.name)}</div>
          <div style="font-size:12px;color:#7A9AB0">${c.code}</div>
        </div>
        <span class="badge" style="background:#E8F5E9;color:#2E7D32;border:1px solid #2E7D3255">妊鑑＋</span>
      </div>`;
    });
    qs('#modal-container').innerHTML=`<div class="overlay" onclick="if(event.target===this)App.closeModal()"><div class="sheet">${html}</div></div>`;
  },

  /* ━ ワクチンお知らせ ━ */
  toggleVaccine(){
    const list=qs('#vaccine-list'), btn=qs('#vaccine-btn');
    if(!list||!btn) return;
    if(list.classList.contains('hidden')){
      this.renderVaccine(); list.classList.remove('hidden');
      btn.textContent='閉じる'; btn.style.background='#EEF2F7'; btn.style.color='#1565C0';
    } else {
      list.classList.add('hidden'); btn.textContent='リスト表示';
      btn.style.background='#90CAF9'; btn.style.color='#0D47A1';
    }
  },

  _vacKey(code, type){ return 'vac_done_'+TODAY_STR+'_'+code+'_'+type; },
  _vacMonthKey(code){ return 'vac12m_'+TODAY.getFullYear()+'_'+String(TODAY.getMonth()+1).padStart(2,'0')+'_'+code; },
  _vacDone(code, type){ return localStorage.getItem(this._vacKey(code,type))==='1'; },
  _vac12mDone(code){ return localStorage.getItem(this._vacMonthKey(code))==='1'; },

  vacConfirm(code, type){
    localStorage.setItem(this._vacKey(code,type),'1');
    this.renderVaccine();
    showToast('確認済みにしました');
  },
  vac12mConfirm(code){
    localStorage.setItem(this._vacMonthKey(code),'1');
    this.renderVaccine();
    showToast('確認済みにしました');
  },

  renderVaccine(){
    const VAC_DAYS=[
      {day:10,name:'ワクチン①',color:'#1565C0',bg:'#E3F2FD'},
      {day:14,name:'ボバクチン',color:'#6A1B9A',bg:'#F3E5F5'},
      {day:30,name:'ワクチン②',color:'#2E7D32',bg:'#E8F5E9'},
    ];
    const thisYear=TODAY.getFullYear(), thisMonth=TODAY.getMonth();

    // 開始日を記録（初回起動日）
    const startKey='vac_start_date';
    if(!localStorage.getItem(startKey)) localStorage.setItem(startKey,TODAY_STR);
    const startDate=new Date(localStorage.getItem(startKey));
    startDate.setHours(0,0,0,0);
    const daysSinceStart=Math.round((TODAY-startDate)/86400000);

    // 個別ワクチン対象
    const indivPending=[];
    STATE.cattle.forEach(function(cow){
      if(!cow.birthdate||cow.birthdate==='2000-01-01') return;
      var birth=new Date(cow.birthdate); birth.setHours(0,0,0,0);
      var ageDays=Math.round((TODAY-birth)/86400000)+1;
      VAC_DAYS.forEach(function(v){
        if(ageDays<v.day) return; // まだ対象日未到達
        // 開始日時点ですでに対象日を過ぎていた牛はスキップ
        var ageAtStart=ageDays-daysSinceStart;
        if(ageAtStart>v.day) return;
        // 確認済みチェック
        var key='vac_done_'+cow.number+'_'+v.name;
        if(localStorage.getItem(key)==='1') return;
        indivPending.push({cow:cow,ageDays:ageDays,v:v});
      });
    });

    // 12ヶ月（今月）
    const month12=[]; const month12Done=[];
    STATE.cattle.forEach(function(cow){
      if(!cow.birthdate||cow.birthdate==='2000-01-01') return;
      var birth=new Date(cow.birthdate);
      var tw=new Date(birth.getFullYear()+1,birth.getMonth(),birth.getDate());
      if(tw.getFullYear()===thisYear&&tw.getMonth()===thisMonth){
        var mkey='vac12m_'+thisYear+'_'+String(thisMonth+1).padStart(2,'0')+'_'+cow.number;
        var obj={cow:cow,twelveDate:tw.toISOString().slice(0,10)};
        if(localStorage.getItem(mkey)==='1') month12Done.push(obj);
        else month12.push(obj);
      }
    });

    var html='<div class="card" style="margin-bottom:12px">';
    html+='<div class="card-h">💉 個別ワクチン対象　<span style="font-size:18px;font-weight:900;color:#1565C0">'+indivPending.length+'頭</span></div>';

    if(!indivPending.length){
      html+='<div style="color:#7A9AB0;text-align:center;padding:12px;font-size:13px">本日の対象牛はいません</div>';
    }
    for(var i=0;i<indivPending.length;i++){
      var c=indivPending[i].cow, ag=indivPending[i].ageDays, v=indivPending[i].v;
      var vkey='vac_done_'+c.number+'_'+v.name;
      html+='<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F4F8">';
      html+='<div style="width:24px;height:24px;border-radius:50%;background:'+v.color+';color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+(i+1)+'</div>';
      html+='<div style="flex:1"><div style="font-size:13px;font-weight:800">'+esc(c.name)+'</div>';
      html+='<div style="font-size:11px;color:#7A9AB0">'+c.number+'　出生'+ag+'日目</div></div>';
      html+='<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">';
      html+='<span style="background:'+v.bg+';color:'+v.color+';border-radius:5px;padding:3px 8px;font-size:10px;font-weight:700">'+v.name+'</span>';
      html+='<button data-vkey="'+vkey+'" onclick="localStorage.setItem(this.dataset.vkey,&quot;1&quot;);App.renderVaccine();" style="background:'+v.color+';color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">✓ 確認済み</button>';
      html+='</div></div>';
    }

    html+='<div class="card-h" style="margin-top:12px">📦 今月12ヶ月になる牛　<span style="font-size:18px;font-weight:900;color:#E65100">'+month12.length+'頭</span></div>';
    if(!month12.length&&!month12Done.length){
      html+='<div style="color:#7A9AB0;text-align:center;padding:12px;font-size:13px">今月12ヶ月になる牛はいません</div>';
    }
    for(var j=0;j<month12.length;j++){
      var mc=month12[j].cow, md=month12[j].twelveDate;
      var mkey='vac12m_'+thisYear+'_'+String(thisMonth+1).padStart(2,'0')+'_'+mc.number;
      html+='<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F4F8">';
      html+='<div style="width:24px;height:24px;border-radius:50%;background:#E65100;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+(j+1)+'</div>';
      html+='<div style="flex:1"><div style="font-size:13px;font-weight:800">'+esc(mc.name)+'</div>';
      html+='<div style="font-size:11px;color:#7A9AB0">'+mc.number+'　'+md+'で12ヶ月</div></div>';
      html+='<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">';
      html+='<span style="background:#FFF3E0;color:#E65100;border-radius:5px;padding:3px 8px;font-size:10px;font-weight:700">12ヶ月</span>';
      html+='<button data-mkey="'+mkey+'" onclick="localStorage.setItem(this.dataset.mkey,&quot;1&quot;);App.renderVaccine();" style="background:#E65100;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">✓ 確認済み</button>';
      html+='</div></div>';
    }

    html+='</div>';
    qs('#vaccine-list').innerHTML=html;
  },

  closeModal(){ qs('#modal-container').innerHTML=''; }
};

App.init();

if('serviceWorker' in navigator){
  const swCode=`const CACHE='dairy-repro-v1';
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll([self.location.href])));self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});
self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
  const blob=new Blob([swCode],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
